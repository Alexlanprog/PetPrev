# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.petprev.com.br app.petprev.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Backend / API (NestJS + MinIO)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.petprev.com.br;

    # Certificados Let's Encrypt mapeados nos volumes do Nginx
    ssl_certificate /etc/letsencrypt/live/api.petprev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.petprev.com.br/privkey.pem;
    
    # Configurações de segurança TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Proteções básicas de Headers (Helmet / HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 50M; # Permite upload de assinaturas e fotos da Trava Térmica

    location /api/v1/ {
        proxy_pass http://backend:3000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para buckets públicos do MinIO (Avatares, PDFs públicos se existirem)
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Frontend Web (Next.js)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.petprev.com.br;

    # Certificados Let's Encrypt mapeados
    ssl_certificate /etc/letsencrypt/live/app.petprev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.petprev.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://frontend_web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
