user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de log estruturado com latência e status de upstream
    log_format main_extended '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for" '
                            'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_extended;

    # Otimizações de I/O de rede
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Limites de upload (fotos de termômetro, fotos de pets e carteirinhas)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Zonas de Rate Limiting
    # Zona 1: Geral de API (100 req/min por IP)
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=100r/m;
    # Zona 2: Endpoints sensíveis de OTP / Auth (10 req/min por IP)
    limit_req_zone $binary_remote_addr zone=auth_otp_limit:10m rate=10r/m;

    # Incluir configurações de virtual hosts
    include /etc/nginx/conf.d/*.conf;
}
