# ==============================================================================
# PETPREV — DOCKER COMPOSE DE PRODUÇÃO (VPS SINGLE-NODE / ON-PREMISE)
# Arquitetura especificada na Seção 1 do SDD v3.0 (Monólito Modular NestJS)
# ==============================================================================

networks:
  petprev-network:
    driver: bridge
    name: petprev-network

volumes:
  postgres_data:
    driver: local
    name: petprev_postgres_data
  redis_data:
    driver: local
    name: petprev_redis_data
  minio_data:
    driver: local
    name: petprev_minio_data
  nginx_certs:
    driver: local
    name: petprev_nginx_certs
  nginx_logs:
    driver: local
    name: petprev_nginx_logs

services:
  # ----------------------------------------------------------------------------
  # 1. REVERSE PROXY & SSL TERMINATION (NGINX)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: petprev_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/letsencrypt
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - minio
    networks:
      - petprev-network

  # ----------------------------------------------------------------------------
  # 2. BANCO DE DADOS RELACIONAL (POSTGRESQL 16 + POSTGIS)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: petprev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petprev_db}
      POSTGRES_USER: ${POSTGRES_USER:-petprev_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petprev_super_secret_db_pass_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
      - ./docker/postgres/02-create-tables.sql:/docker-entrypoint-initdb.d/02-create-tables.sql:ro
      - ./database/seeds/001_initial_seed.sql:/docker-entrypoint-initdb.d/03-initial-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petprev_admin} -d ${POSTGRES_DB:-petprev_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - petprev-network

  # ----------------------------------------------------------------------------
  # 3. CACHE EM MEMÓRIA & FILAS ASSÍNCRONAS (REDIS 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: petprev_redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-petprev_redis_secret_pass_change_me} 
      --appendonly yes 
      --maxmemory 256mb 
      --maxmemory-policy noeviction
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-petprev_redis_secret_pass_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - petprev-network

  # ----------------------------------------------------------------------------
  # 4. STORAGE LOCAL COMPATÍVEL COM S3 (MINIO)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: petprev_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_petprev_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_super_secret_storage_pass_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - petprev-network

  # ----------------------------------------------------------------------------
  # 5. INICIALIZADOR DE BUCKETS MINIO (ONE-OFF JOB)
  # ----------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: petprev_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_petprev_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_super_secret_storage_pass_change_me}
    volumes:
      - ./docker/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    networks:
      - petprev-network

  # ----------------------------------------------------------------------------
  # 6. BACKEND MONÓLITO MODULAR (NESTJS / TYPESCRIPT)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petprev_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      API_PREFIX: ${API_PREFIX:-api/v1}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-petprev_db}
      POSTGRES_USER: ${POSTGRES_USER:-petprev_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petprev_super_secret_db_pass_change_me}
      DATABASE_URL: ${DATABASE_URL:-postgresql://petprev_admin:petprev_super_secret_db_pass_change_me@postgres:5432/petprev_db?schema=public}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-petprev_redis_secret_pass_change_me}
      REDIS_URL: ${REDIS_URL:-redis://:petprev_redis_secret_pass_change_me@redis:6379}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_petprev_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_super_secret_storage_pass_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-petprev_access_token_jwt_secret_key_change_me_in_prod_min_32_chars}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-petprev_refresh_token_jwt_secret_key_change_me_in_prod_min_32_chars}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-180}
      OTP_COOLDOWN_SECONDS: ${OTP_COOLDOWN_SECONDS:-60}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-3}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - petprev-network
